backend:
  name: github
  repo: Bygmedai/emilsalzer.dk
  branch: main
  base_url: https://oauth.bygmedai.dk

publish_mode: simple

media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: pages
    label: Sider
    files:

      - name: forside
        label: Forside
        file: src/_data/pages/forside.json
        fields:
          - { name: title, label: "Side-titel (SEO)", widget: string }
          - { name: description, label: "Meta-beskrivelse", widget: string }
          - { name: ogTitle, label: "OG-titel", widget: string }
          - { name: ogDescription, label: "OG-beskrivelse", widget: string }
          - { name: heroTagline, label: "Hero tagline", widget: string }
          - { name: heroQuote, label: "Hero citat", widget: text }
          - { name: heroQuoteSource, label: "Hero citatskilde", widget: string }
          - { name: bannerText, label: "Bannertekst", widget: text }
          - { name: section1h2, label: "Sektion 1 overskrift", widget: string }
          - { name: section1body, label: "Sektion 1 brødtekst", widget: text }
          - { name: section1quote, label: "Sektion 1 citat", widget: text }
          - { name: section1quoteSource, label: "Sektion 1 citatskilde", widget: string }
          - { name: section1cta, label: "Sektion 1 CTA-tekst", widget: string }
          - { name: section2h2, label: "Sektion 2 overskrift", widget: string }
          - { name: section2intro, label: "Sektion 2 intro", widget: text }
          - { name: section2quote, label: "Sektion 2 citat", widget: text }
          - { name: section2body, label: "Sektion 2 brødtekst", widget: text }
          - { name: poem, label: "Digt (brug \\n til linjeskift)", widget: text }

      - name: kontakt
        label: Kontakt
        file: src/_data/pages/kontakt.json
        fields:
          - { name: title, label: "Side-titel (SEO)", widget: string }
          - { name: description, label: "Meta-beskrivelse", widget: string }
          - { name: ogTitle, label: "OG-titel", widget: string }
          - { name: ogDescription, label: "OG-beskrivelse", widget: string }
          - { name: formHeading, label: "Formularoverskrift", widget: string }
          - { name: formSubtext, label: "Formular undertekst", widget: text }
          - { name: formEmail, label: "Formspree ID", widget: string }
          - { name: successMessage, label: "Succesbesked", widget: text }

      - name: boeger
        label: Bøger
        file: src/_data/pages/boeger.json
        fields:
          - { name: title, label: "Side-titel (SEO)", widget: string }
          - { name: description, label: "Meta-beskrivelse", widget: string }
          - { name: ogTitle, label: "OG-titel", widget: string }
          - { name: ogDescription, label: "OG-beskrivelse", widget: string }
          - { name: heading, label: "Overskrift", widget: string }
          # Listen af bøger står IKKE her længere. Oversigten på /boeger/
          # bygges af bøgerne selv — se samlingen «Bøger» i menuen til venstre.
          # Sådan kan et link aldrig komme til at pege på den forkerte bog.

      - name: filosofi
        label: Filosofi
        file: src/_data/pages/filosofi.json
        fields:
          - { name: title, label: "Side-titel (SEO)", widget: string }
          - { name: description, label: "Meta-beskrivelse", widget: string }
          - { name: ogTitle, label: "OG-titel", widget: string }
          - { name: ogDescription, label: "OG-beskrivelse", widget: string }
          - { name: heading, label: "Overskrift", widget: string }
          - { name: body, label: "Indhold (HTML)", widget: markdown }

      - name: poesi
        label: Poesi
        file: src/_data/pages/poesi.json
        fields:
          - { name: title, label: "Side-titel (SEO)", widget: string }
          - { name: description, label: "Meta-beskrivelse", widget: string }
          - { name: ogTitle, label: "OG-titel", widget: string }
          - { name: ogDescription, label: "OG-beskrivelse", widget: string }
          - { name: heading, label: "Overskrift", widget: string }
          - { name: intro, label: "Intro-tekst", widget: text }
          - { name: introCta, label: "Intro CTA", widget: string }
          # «Digte (HTML)» er fjernet. Feltet blev aldrig vist på sitet —
          # digtene kommer fra samlingen «Digte» i menuen til venstre.

      - name: foredrag
        label: Foredrag
        file: src/_data/pages/foredrag.json
        fields:
          - { name: title, label: "Side-titel (SEO)", widget: string }
          - { name: description, label: "Meta-beskrivelse", widget: string }
          - { name: ogTitle, label: "OG-titel", widget: string }
          - { name: ogDescription, label: "OG-beskrivelse", widget: string }
          - { name: heading, label: "Overskrift", widget: text }
          - { name: intro1, label: "Intro 1", widget: text }
          - { name: btQuote, label: "BT-citat", widget: string }
          - { name: intro2, label: "Intro 2", widget: text }
          - { name: intro3, label: "Intro 3", widget: text }
          - { name: bookingHeading, label: "Bookingsoverskrift", widget: string }
          - { name: formspreeId, label: "Formspree ID", widget: string }
          - { name: successMessage, label: "Succesbesked", widget: text }
          - name: reviews
            label: Anmeldelser
            widget: list
            fields:
              - { name: quote, label: "Citat", widget: text }
              - { name: attribution, label: "Ophavsmand", widget: string }

  - name: "poesi_digte"
    label: "Digte"
    folder: "src/poesi"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - label: "År"
        name: "year"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Kun på det FØRSTE digt i et årstal. Lader du feltet stå tomt, havner digtet under årstallet ovenover. Årstallet skrives kun én gang på siden."
      - { label: "Dato", name: "date", widget: "datetime", required: false }
      - label: "Note under digtet"
        name: "note"
        widget: "string"
        required: false
        hint: "Links skrives sådan: `[teksten der skal kunne klikkes](https://adressen.dk)`. Skråskrift: `*ord med stjerner om*`."
      - label: "Rækkefølge"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 99
        hint: "Højeste tal står øverst. Lad den stå på 99, så lander det nye digt i toppen."
      - { label: "Digt", name: "body", widget: "markdown" }

  # ── Bøgerne ──────────────────────────────────────────────────────────────
  # Én bog = én post her. Opretter du en bog, får den både sin egen side OG
  # en plads i oversigten på /boeger/ — du skal ikke skrive den to steder.
  - name: "boeger_bind"
    label: "Bøger"
    label_singular: "bog"
    folder: "src/boeger"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{fields.listYear}} — {{fields.title}}"
    sortable_fields: ["listYear", "title"]
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "bog.njk" }
      - label: "Kladde — vises ikke på sitet endnu"
        name: "udkast"
        widget: "boolean"
        default: true
        required: false
        hint: "Så længe der er flueben her, er bogen usynlig for besøgende. Fjern fluebenet når teksten er færdig."
      - { label: "Bogens titel", name: "title", widget: "string", hint: "Kun navnet — fx «Kaosviol». Uden «— Emil Salzer»; det sætter sitet selv på." }
      - label: "År"
        name: "year"
        widget: "string"
        hint: "Sådan som det skal stå på bogsiden. Må gerne være et spænd, fx «2020–2022»."
      - label: "År i oversigten"
        name: "listYear"
        widget: "number"
        value_type: "int"
        hint: "Ét tal. Bestemmer både hvad der står i oversigten på /boeger/ og hvor bogen placeres — højeste år øverst."
      - { label: "Sidetal", name: "sider", widget: "number", value_type: "int", required: false }
      - label: "Forside (billede)"
        name: "cover"
        widget: "image"
        media_library: { config: { multiple: false } }
        hint: "Upload billedet her. Brug samme kvadratiske format som de andre forsider."
      - { label: "Billedbeskrivelse", name: "alt", widget: "string", hint: "Kort beskrivelse for skærmlæsere og Google, fx «Kaosviol — digtsamling af Emil Salzer»." }
      - { label: "Kort beskrivelse (Google og sociale medier)", name: "description", widget: "text", hint: "1–2 sætninger. Det er dem der står under linket i en Google-søgning." }
      - label: "Pris i kroner"
        name: "price"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Lad feltet stå tomt, hvis bogen ikke sælges via MobilePay. Så skrives hele købsafsnittet ikke. Porto på 60 kr. lægges til automatisk."
      - { label: "Anmeldelsescitat", name: "quote", widget: "text", required: false }
      - { label: "Hvem sagde det", name: "quoteSource", widget: "string", required: false, hint: "Fx «Cogito (norsk tidsskrift)». Skrives uden tankestreg foran." }
      - { label: "Bogens tekst", name: "body", widget: "markdown", hint: "Ét afsnit per blok. Skråskrift: `*ord med stjerner om*`. Links: `[tekst](https://adresse.dk)`." }
